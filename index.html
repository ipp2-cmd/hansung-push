<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "900124da-c0c8-4c5d-beb7-7f6171628b36"
    });

    // 부모 창에서 학번 받기
    window.addEventListener('message', async function(event) {
      if (event.data && event.data.type === 'SET_USER_ID') {
        var studentId = event.data.studentId;
        await OneSignal.login(String(studentId));
      }
      
      if (event.data && event.data.type === 'REQUEST_PUSH') {
        var permission = OneSignal.Notifications.permission;
        if (!permission) {
          await OneSignal.Slidedown.promptPush();
        }
        // 결과를 부모창에 전달
        event.source.postMessage({
          type: 'PUSH_RESULT',
          permission: OneSignal.Notifications.permission
        }, '*');
      }
    });

    // 준비 완료 알림
    window.parent.postMessage({ type: 'ONESIGNAL_READY' }, '*');
  });
</script>
</body>
</html>
